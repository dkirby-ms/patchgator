[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchgator-studio"
version = "0.1.0"
description = "Local audio and MIDI tools for PatchGator sound matching"
requires-python = ">=3.11"
dependencies = [
  "azure-ai-projects>=2.0.0b2",
  "azure-identity>=1.17",
  "mido>=1.3",
  "numpy>=2.0",
  "openai>=1.66",
  "python-dotenv>=1.0",
  "python-rtmidi>=1.5",
  "sounddevice>=0.5",
  "soundfile>=0.12",
]

[project.scripts]
patchgator-studio = "patchgator_studio.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["patchgator_studio*"]
